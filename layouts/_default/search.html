{{ define "main" }}
<h1>{{ i18n "search_results" | default "Search Results" }}</h1>
<div id="search"></div>
{{ if .Site.Params.search_enabled }}
<link href="{{ "/_pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">
<script src="{{ "/_pagefind/pagefind-ui.js" | relURL }}"></script>
<script>
  window.addEventListener('DOMContentLoaded', function() {
    new PagefindUI({
      element: "#search",
      showSubResults: true,
      showImages: false
    });
    var q = new URLSearchParams(location.search).get('q');
    if (q) {
      var input = document.querySelector('.pagefind-ui__search-input');
      if (input) {
        input.value = q;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }
  });
</script>
{{ end }}
{{ end }}
